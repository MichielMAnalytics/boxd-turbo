<text x="32" y="44" font-size="20" fill="#f0efec" font-weight="650">Push to green on vercel/ai</text><text x="32" y="68" font-size="13" fill="#c3c2b7">Median of 3 pushes each, from git push to the result on GitHub. Same commit, same tasks.</text><rect x="32" y="82" width="12" height="12" rx="3" fill="#3987e5"/><text x="50" y="92" font-size="13" fill="#f0efec">boxd CI</text><rect x="124" y="82" width="12" height="12" rx="3" fill="#d95926"/><text x="142" y="92" font-size="13" fill="#f0efec">Vercel CI</text><line x1="220" y1="102" x2="220" y2="346" stroke="#383835" stroke-width="1"/><text x="32" y="128" font-size="14" fill="#f0efec" font-weight="600">Docs-only change</text><text x="32" y="147" font-size="12" fill="#898781">nothing to rebuild</text><path d="M220,108 h7.097811217510262 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-7.097811217510262 z" fill="#3987e5"><title>boxd CI, Docs-only change: 5.9 s</title></path><text x="239.09781121751027" y="124" font-size="13" fill="#f0efec" font-weight="600">5.9 s</text><path d="M220,134 h141.96443228454174 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-141.96443228454174 z" fill="#d95926"><title>Vercel CI, Docs-only change: 78 s</title></path><text x="373.9644322845418" y="150" font-size="13" fill="#f0efec" font-weight="600">78 s</text><text x="32" y="166" font-size="12" fill="#c3c2b7" font-weight="600">boxd CI 13× faster</text><text x="32" y="212" font-size="14" fill="#f0efec" font-weight="600">One provider package</text><text x="32" y="231" font-size="12" fill="#898781">packages/mistral</text><path d="M220,192 h33.43160054719562 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-33.43160054719562 z" fill="#3987e5"><title>boxd CI, One provider package: 20 s</title></path><text x="265.4316005471956" y="208" font-size="13" fill="#f0efec" font-weight="600">20 s</text><path d="M220,218 h126.35225718194255 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-126.35225718194255 z" fill="#d95926"><title>Vercel CI, One provider package: 69 s</title></path><text x="358.35225718194255" y="234" font-size="13" fill="#f0efec" font-weight="600">69 s</text><text x="32" y="250" font-size="12" fill="#c3c2b7" font-weight="600">boxd CI 3.5× faster</text><text x="32" y="296" font-size="14" fill="#f0efec" font-weight="600">A core package</text><text x="32" y="315" font-size="12" fill="#898781">packages/provider-utils</text><path d="M220,276 h465.8700410396718 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-465.8700410396718 z" fill="#3987e5"><title>boxd CI, A core package: 4 min 10 s</title></path><text x="697.8700410396718" y="292" font-size="13" fill="#f0efec" font-weight="600">4 min 10 s</text><path d="M220,302 h546 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-546 z" fill="#d95926"><title>Vercel CI, A core package: 4 min 52 s</title></path><text x="778" y="318" font-size="13" fill="#f0efec" font-weight="600">4 min 52 s</text><text x="32" y="334" font-size="12" fill="#c3c2b7" font-weight="600">boxd CI 1.2× faster</text><text x="32" y="384" font-size="12" fill="#898781">type-check and test of 84 packages (249 tasks), tagged ci the Vercel CI way. Raw runs in bench/results.</text>
