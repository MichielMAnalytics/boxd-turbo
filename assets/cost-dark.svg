<svg xmlns="http://www.w3.org/2000/svg" width="880" height="406" viewBox="0 0 880 406" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="What one run costs. Median per push, at list prices. boxd: every machine for every second it was up, plus the server.">
<title>What one run costs. Median per push, at list prices. boxd: every machine for every second it was up, plus the server.</title>
