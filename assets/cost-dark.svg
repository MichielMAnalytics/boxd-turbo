ec" font-weight="600">0.4¢</text><path d="M220,218 h4.83787661406026 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-4.83787661406026 z" fill="#d95926"><title>Vercel CI, One provider package: 1.1¢</title></path><text x="236.83787661406026" y="234" font-size="13" fill="#f0efec" font-weight="600">1.1¢</text><text x="32" y="250" font-size="12" fill="#c3c2b7" font-weight="600">boxd CI 3.2× cheaper</text><text x="32" y="296" font-size="14" fill="#f0efec" font-weight="600">A core package</text><text x="32" y="315" font-size="12" fill="#898781">packages/provider-utils</text><path d="M220,276 h280.05365056591745 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-280.05365056591745 z" fill="#3987e5"><title>boxd CI, A core package: 36¢</title></path><text x="512.0536505659175" y="292" font-size="13" fill="#f0efec" font-weight="600">36¢</text><path d="M220,302 h546 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-546 z" fill="#d95926"><title>Vercel CI, A core package: 70¢</title></path><text x="778" y="318" font-size="13" fill="#f0efec" font-weight="600">70¢</text><text x="32" y="334" font-size="12" fill="#c3c2b7" font-weight="600">boxd CI 1.9× cheaper</text><text x="32" y="384" font-size="12" fill="#898781">Vercel CI: $0.0035 per CPU-minute. boxd: $0.059 per vCPU-hour and $0.018 per GiB-hour.</text>
